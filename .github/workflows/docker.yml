name: CI/CD Pipeline - Build, Test & Publish

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

jobs:
  lint-and-test:
    name: Lint & Syntax Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout du dépôt
        uses: actions/checkout@v4

      - name: Configuration de l'environnement PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.2"
          extensions: pdo, pdo_mysql, mysqli

      - name: Analyse syntaxique PHP (php -l)
        run: find sources/app -name "*.php" -print0 | xargs -0 -n1 php -l

      - name: Validation de la configuration Docker Compose
        run: |
          cp .env.example .env
          docker compose config --quiet

  build-and-publish:
    name: Build, Scan & Publish
    needs: lint-and-test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout du dépôt
        uses: actions/checkout@v4

      - name: Configuration de Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Connexion à Docker Hub
        if: github.event_name != 'pull_request' && secrets.DOCKERHUB_USERNAME != '' && secrets.DOCKERHUB_TOKEN != ''
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Construction de l'image web
        uses: docker/build-push-action@v5
        with:
          context: .
          file: Dockerfile
          load: true
          push: false
          tags: articles-web:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Scan Trivy de l'image web
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: articles-web:ci
          format: table
          exit-code: "1"
          ignore-unfixed: true
          severity: CRITICAL,HIGH

      - name: Construction de l'image base
        uses: docker/build-push-action@v5
        with:
          context: .
          file: docker/mysql/Dockerfile
          load: true
          push: false
          tags: articles-db:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Scan Trivy de l'image base
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: articles-db:ci
          format: table
          exit-code: "1"
          ignore-unfixed: true
          severity: CRITICAL,HIGH

      - name: Publication Docker Hub
        if: github.event_name != 'pull_request' && secrets.DOCKERHUB_USERNAME != '' && secrets.DOCKERHUB_TOKEN != ''
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
        run: |
          sha="${GITHUB_SHA::7}"
          for image in articles-web articles-db; do
            docker tag "${image}:ci" "${DOCKERHUB_USERNAME}/${image}:latest"
            docker tag "${image}:ci" "${DOCKERHUB_USERNAME}/${image}:sha-${sha}"
            docker push "${DOCKERHUB_USERNAME}/${image}:latest"
            docker push "${DOCKERHUB_USERNAME}/${image}:sha-${sha}"
          done
